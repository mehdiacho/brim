<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brim · a living notch for Windows</title>
<meta name="description" content="Brim puts a living notch at the top of your Windows screen: media and lyrics, a focus timer, water reminders, a to-do list, a file shelf, and quick status for volume, brightness, battery, Bluetooth, network and notifications.">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #07080a;
    --panel: #101216;
    --line: #1d2026;
    --text: #eceef2;
    --mist: #9aa0aa;
    --green: #5cd278;
    --red: #ff6256;
    --blue: #50aaff;
    --chip: rgba(255,255,255,.11);
    --s: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 16px 20px; }

  /* A screen with Brim's notch cycling through what it can show. Sizes are Brim's own, in DIPs
     (1em = 12.5 DIPs), scaled by --s to fit the mock screen. */
  .screen {
    position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 8;
    border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #1b2a4a 0%, #0d1220 45%, #090b10 100%);
  }
  .notch {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: calc(112px * var(--s)); height: calc(14px * var(--s));
    background: #000; border-radius: 0 0 calc(7px * var(--s)) calc(7px * var(--s));
    box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden;
    transition: width .34s cubic-bezier(.3,1.25,.5,1), height .34s cubic-bezier(.3,1.25,.5,1), border-radius .34s;
    font-size: calc(12.5px * var(--s)); line-height: 1.35;
  }
  .content { position: absolute; inset: 0; display: flex; align-items: center; opacity: 0; transition: opacity .14s; }
  .content.on { opacity: 1; }
  .content svg { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .row { display: flex; align-items: center; width: 100%; gap: .75em; padding: 0 1.25em; white-space: nowrap; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .b { font-weight: 600; }
  .dim { color: var(--mist); }
  .bar { flex: 1; height: .32em; border-radius: 1em; background: #2a2d33; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 1em; transition: width .45s cubic-bezier(.3,1.2,.5,1); }
  .art { width: 1.4em; height: 1.4em; border-radius: .3em; background: linear-gradient(135deg,#ff8a5c,#c03a7a); flex: none; }
  .eq { display: flex; gap: .2em; align-items: center; height: 1em; }
  .eq i { width: .24em; background: #ff8a5c; border-radius: .2em; animation: eq .6s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: .15s } .eq i:nth-child(3) { animation-delay: .3s } .eq i:nth-child(4) { animation-delay: .45s }
  @keyframes eq { from { height: .25em } to { height: 1em } }

  /* Mascot: two eyes that look around and blink. */
  .eyes { width: 100%; display: flex; justify-content: center; gap: 1.1em; }
  .eye { width: .68em; height: .68em; border-radius: 50%; background: #fff; position: relative; animation: blink 2.6s infinite; }
  .eye i { position: absolute; width: .34em; height: .34em; border-radius: 50%; background: #0e0f12; left: .17em; top: .17em; animation: look 2.6s infinite; }
  @keyframes look { 0%,20% { transform: translate(0,0) } 35%,55% { transform: translate(.13em,.05em) } 70%,90% { transform: translate(-.13em,.04em) } 100% { transform: translate(0,0) } }
  @keyframes blink { 0%,60%,66%,100% { transform: scaleY(1) } 63% { transform: scaleY(.12) } }

  /* Expanded pages: header, body, page arrows and dots. */
  .pg { position: absolute; inset: 0; }
  .hd { position: absolute; left: 2.88em; right: 2.88em; top: .64em; height: 1.92em; display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
  .t { font-size: 1.24em; font-weight: 600; }
  .meta { display: flex; align-items: center; gap: .55em; }
  .meta .time { font-weight: 700; }
  .batt { width: 1.3em; height: 1.3em; }
  .bd { position: absolute; left: 2.88em; right: 2.88em; top: 3.1em; bottom: 1.5em; }
  .arrow { position: absolute; top: 7.2em; transform: translateY(-50%); width: 1.76em; height: 1.76em; border-radius: 50%; background: var(--chip); display: grid; place-items: center; }
  .arrow svg { width: .8em; height: .8em; stroke-width: 2.4; }
  .arrow.l { left: .48em } .arrow.r { right: .48em }
  .dots { position: absolute; top: 12.1em; left: 50%; transform: translateX(-50%); display: flex; gap: .48em; }
  .dots i { width: .32em; height: .32em; border-radius: 1em; background: rgba(255,255,255,.18); }
  .dots i.on { width: 1.12em; background: #fff; }
  .pb { display: inline-flex; align-items: center; justify-content: center; gap: .45em; height: 2.2em; padding: 0 1.1em; border-radius: 2em; background: var(--chip); font-weight: 600; font-size: .92em; white-space: nowrap; }
  .pb svg { width: 1.05em; height: 1.05em; }
  .round { width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center; background: var(--chip); flex: none; }

  .media { display: flex; gap: 1.28em; }
  .media .art { width: 7.04em; height: 7.04em; border-radius: .96em; }
  .media .title { font-size: 1.2em; font-weight: 600; }
  .lyric { margin-top: .2em; color: #ff8a5c; transition: opacity .2s; }
  .prog { margin-top: .7em; height: .32em; border-radius: 1em; background: #2a2d33; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 38%; background: #fff; border-radius: 1em; transition: width 2.2s linear; }
  .ctl { display: flex; gap: 2.2em; margin-top: .5em; justify-content: center; }
  .ctl svg { fill: #fff; stroke: none; width: 1.3em; height: 1.3em; }

  .ringbox { position: relative; flex: none; }
  .ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ringbox span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ringbox .arc { transition: stroke-dashoffset 2s linear; }
  .clock { font-size: 3em; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: .5em; margin-top: .75em; }
  .chips .pb { height: 2.08em; min-width: 7em; }

  .big { font-size: 2.4em; font-weight: 700; line-height: 1; }
  .vline { width: 1px; background: rgba(255,255,255,.12); align-self: stretch; }

  .tiles { display: flex; gap: .6em; margin-top: .55em; }
  .tile { width: 5.12em; display: flex; flex-direction: column; align-items: center; gap: .3em; }
  .thumb { width: 3.52em; height: 3.52em; border-radius: .7em; display: grid; place-items: center; }
  .thumb svg { width: 1.6em; height: 1.6em; }
  .tile small { font-size: .78em; color: var(--mist); width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.new { animation: drop .45s cubic-bezier(.3,1.4,.5,1); }
  @keyframes drop { from { transform: translateY(-1.6em) scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }

  .tasks { margin-top: .5em; display: flex; flex-direction: column; gap: .18em; }
  .task { display: flex; align-items: center; gap: .7em; height: 1.76em; }
  .check { width: 1.1em; height: 1.1em; border-radius: 50%; border: 1.6px solid rgba(255,255,255,.45); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; }
  .check svg { width: .7em; height: .7em; stroke-width: 3; opacity: 0; transition: opacity .2s; }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .task.done .check svg { opacity: 1; }
  .task.done .name { color: var(--mist); text-decoration: line-through; }
  .task .when { color: var(--mist); font-variant-numeric: tabular-nums; }
  .now { width: .4em; height: .4em; border-radius: 50%; background: var(--green); flex: none; }

  .prompt { padding: 0 1.1em; gap: .9em; width: 100%; }
  .prompt .icon { width: 2.72em; height: 2.72em; border-radius: .8em; display: grid; place-items: center; flex: none; }
  .prompt .icon svg { width: 1.3em; height: 1.3em; stroke: currentColor; }
  .prompt .pb { min-width: 6em; }
  .toast { padding: 0 1.1em; gap: .9em; width: 100%; }
  .toast .icon { width: 2.6em; height: 2.6em; border-radius: .7em; background: #1d6bf3; display: grid; place-items: center; flex: none; }
  .toast .icon svg { width: 1.3em; height: 1.3em; }
  .tline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; }
  .btn {
    display: inline-flex; flex-direction: column; align-items: center; padding: 13px 26px; border-radius: 18px;
    font-weight: 650; text-decoration: none; border: 1px solid var(--line); background: var(--panel); line-height: 1.25;
  }
  .btn small { font-weight: 400; font-size: 12px; opacity: .65; margin-top: 2px; }
  .btn.primary { background: var(--text); color: #0a0b0d; border-color: var(--text); }
  .btn:hover { filter: brightness(1.08); }
  footer { color: var(--mist); font-size: 14px; padding: 28px 20px 30px; display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) {
    .notch, .content, .bar i, .prog i, .ringbox .arc { transition: none; }
    .eq i, .eye, .eye i, .tile.new { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="screen" aria-label="Brim showing music, a focus timer, water reminders, a to-do list, a file shelf and quick status">
    <div class="notch" id="notch"><div class="content" id="content"></div></div>
  </div>
  <div class="buttons">
    <a class="btn primary" href="https://github.com/mehdiacho/brim/releases/latest/download/Brim-portable.exe">Download for Windows<small id="version">Windows 10 and 11 · portable</small></a>
    <a class="btn" href="https://github.com/mehdiacho/brim/releases/latest/download/Brim.msix">MSIX package<small>needs Brim.cer trusted</small></a>
  </div>
</main>
<footer>
  <span>Brim by <a href="https://mehdiacho.tech">Mehdi Acho</a></span>
  <span>Lyrics by <a href="https://lrclib.net">LRCLIB</a></span>
</footer>
<script>
  // Line icons, drawn on a 24-unit grid.
  const I = {
    vol: '<svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    caps: '<svg viewBox="0 0 24 24"><path d="M12 4l7 8h-4v4H9v-4H5z"/><path d="M9 20h6"/></svg>',
    bat: '<svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3"/><path d="M11.5 8.5l-2.5 4h3l-2 3" stroke="#5cd278"/></svg>',
    bt: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>',
    wifi: '<svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".6" fill="#fff"/></svg>',
    msg: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    prev: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
    left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
    timer: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M18.5 6.5l1.5-1.5"/></svg>',
    reset: '<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v4h4"/></svg>',
    drop: '<svg viewBox="0 0 24 24"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z" fill="currentColor" stroke="none"/></svg>',
    gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
    bell: '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
    tick: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    task: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
    doc: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    img: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    zip: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 3v2M12 7v2M12 11v2"/><rect x="10.5" y="14" width="3" height="3" rx=".6"/></svg>',
  };
  const lyrics = ['and the city hums below us', 'headlights paint the overpass', 'we drive until the morning'];
  const level = (icon, from, to) => ({ html: `<div class="row">${icon}<span class="bar"><i style="width:${from}%"></i></span><span class="b">${to}</span></div>`,
    after: el => setTimeout(() => el.querySelector('.bar i').style.width = to + '%', 60) });
  const status = (icon, text, detail) => ({ html: `<div class="row">${icon}<span class="grow b">${text}</span><span class="dim">${detail}</span></div>` });
  const ring = (size, frac, color, width, inner) => {
    const c = 2 * Math.PI * 15;
    return `<div class="ringbox" style="width:${size}em;height:${size}em"><svg viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="15" stroke="${color}" stroke-opacity=".22" stroke-width="${width}" fill="none"/>
      <circle class="arc" cx="18" cy="18" r="15" stroke="${color}" stroke-width="${width}" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(1)}"/></svg><span>${inner}</span></div>`;
  };

  // An expanded page: a title with a coloured second word, the battery/date/time header, the body, arrows and page dots.
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const date = now.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  const page = (first, second, color, dot, body) => `<div class="pg">
      <div class="hd"><span class="t">${first} <span style="color:${color}">${second}</span></span>
        <span class="meta"><svg class="batt" viewBox="0 0 36 36" style="transform:rotate(-90deg)"><circle cx="18" cy="18" r="14" stroke="#2a2d33" stroke-width="4" fill="none"/>
          <circle cx="18" cy="18" r="14" stroke="#5cd278" stroke-width="4" fill="none" stroke-dasharray="88" stroke-dashoffset="19"/></svg>
          <span class="dim">${date}</span><span class="time">${time}</span></span></div>
      <div class="bd">${body}</div>
      <span class="arrow l">${I.left}</span><span class="arrow r">${I.right}</span>
      <div class="dots">${[0, 1, 2, 3, 4].map(n => `<i class="${n === dot ? 'on' : ''}"></i>`).join('')}</div></div>`;
  const prompt = (icon, tint, title, body, a, b) => ({ w: 420, h: 64, r: 26, ms: 1900, html: `<div class="row prompt">
      <span class="icon" style="background:${tint}33;color:${tint}">${icon}</span>
      <div class="grow"><div class="tline b">${title}</div><div class="tline dim" style="font-size:.9em">${body}</div></div>
      <span class="pb">${a}</span><span class="pb" style="background:${tint}9e">${b}</span></div>` });
  const EXP = { w: 500, h: 164, r: 26 };

  // Each state: size in DIPs (Brim's own), corner radius, content, and how long it stays.
  const states = [
    { w: 112, h: 14, r: 7, ms: 700 },
    { w: 124, h: 22, r: 11, ms: 2000, html: `<div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div>` },
    { w: 200, h: 26, r: 13, ms: 1300, html: `<div class="row" style="padding:0 .5em 0 .4em"><span class="art"></span><span class="grow dim">Midnight Drive</span><span class="eq"><i></i><i></i><i></i><i></i></span></div>` },
    { ...EXP, ms: 2600, html: page('Now', 'Playing', '#ff8a5c', 0, `<div class="media"><span class="art"></span><div class="grow">
        <div class="title">Midnight Drive</div><div class="dim">Neon Coast</div><div class="lyric" id="lyric">${lyrics[0]}</div>
        <div class="prog"><i></i></div><div class="ctl">${I.prev}${I.pause}${I.next}</div></div></div>`),
      after: el => {
        setTimeout(() => el.querySelector('.prog i').style.width = '52%', 60);
        lyrics.slice(1).forEach((l, i) => setTimeout(() => { const n = el.querySelector('#lyric'); if (n) n.textContent = l; }, 800 * (i + 1)));
      } },
    { w: 260, h: 34, r: 17, ms: 1100, ...level(I.vol, 40, 72) },
    { ...EXP, ms: 2300, html: page('Focus', 'Timer', 'var(--red)', 1, `<div style="display:flex;align-items:center;gap:1.6em;height:100%">
        ${ring(6.4, 1, '#ff6256', 3.2, I.timer.replace('<svg', '<svg style="width:2.1em;height:2.1em;transform:none"'))}
        <div class="grow"><div class="clock" id="clock">25:00</div><div class="dim">Focus · round 1 of 4</div>
          <div class="chips"><span class="pb" style="background:#ff62569e">Focus</span><span class="pb">Short break</span><span class="pb">Long break</span></div></div>
        <span class="round" style="background:var(--red);align-self:flex-start;margin-top:.6em">${I.pause.replace('<svg', '<svg style="fill:#fff;stroke:none"')}</span></div>`),
      after: el => {
        setTimeout(() => el.querySelector('.arc').style.strokeDashoffset = (2 * Math.PI * 15 * 0.04).toFixed(1), 60);
        let s = 1500;
        const tick = setInterval(() => { const c = el.querySelector('#clock'); if (!c) return clearInterval(tick); s -= 1; c.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 450);
      } },
    { w: 200, h: 26, r: 13, ms: 1300, html: `<div class="row" style="padding:0 .7em 0 .55em">${ring(1.1, .92, '#ff6256', 5, '')}<span class="grow"></span><span class="b" style="color:var(--red)">24:52</span></div>` },
    { ...EXP, ms: 2300, html: page('Water', 'Tracker', 'var(--blue)', 2, `<div style="display:flex;gap:1.4em;height:100%">
        <div class="grow"><div style="display:flex;align-items:baseline;gap:.4em"><span class="big" id="litres">1.1</span><span class="dim">/ 2.0 L</span></div>
          <div class="dim" style="margin-top:.5em;font-size:.9em" id="pct">Today · 55% · reminders on</div>
          <div class="prog" style="margin-top:.5em"><i id="wbar" style="width:55%;background:var(--blue);transition:width .5s"></i></div>
          <div style="display:flex;gap:.6em;margin-top:.9em"><span class="pb" style="background:#50aaff9e;color:#fff">${I.drop}Drink</span><span class="pb">${I.gear}Settings</span></div></div>
        <span class="vline"></span>${ring(6, .55, '#50aaff', 3.4, '<b id="wring" style="font-size:1.3em">55%</b>')}</div>`),
      after: el => setTimeout(() => {
        el.querySelector('#litres').textContent = '1.2';
        el.querySelector('#pct').textContent = 'Today · 58% · reminders on';
        el.querySelector('#wbar').style.width = '58%';
        el.querySelector('#wring').textContent = '58%';
        el.querySelectorAll('.arc')[0].style.strokeDashoffset = (2 * Math.PI * 15 * 0.42).toFixed(1);
      }, 1100) },
    prompt(I.drop, '#50aaff', 'Time for a sip', 'About 56 ml keeps you on track', 'Later', 'Drank'),
    { ...EXP, ms: 2400, html: page('To-do', 'Today', 'var(--green)', 4, `<div style="display:flex;justify-content:space-between;align-items:center">
          <span class="dim" id="done">1 of 3 done</span><span style="display:flex;gap:.5em"><span class="pb" style="height:1.9em">${I.plus}Add</span><span class="pb" style="height:1.9em">Edit</span></span></div>
        <div class="tasks">
          <div class="task done"><span class="check">${I.tick}</span><span class="grow name">Reply to the venue</span><span class="when">09:00</span></div>
          <div class="task" id="t2"><span class="check">${I.tick}</span><span class="now"></span><span class="grow name">Draft the slides</span><span class="when">10:30-12:00</span></div>
          <div class="task"><span class="check">${I.tick}</span><span class="grow name">Call the bank</span><span class="when">15:00</span></div></div>`),
      after: el => setTimeout(() => { el.querySelector('#t2').classList.add('done'); el.querySelector('#done').textContent = '2 of 3 done'; }, 1300) },
    prompt(I.task, '#5cd278', 'Task time', 'Call the bank · 15:00', 'Later', 'Start'),
    { ...EXP, ms: 2500, html: page('Shelf', '', '#fff', 3, `<div style="display:flex;justify-content:space-between;align-items:center">
          <span class="dim" id="count">3 items</span><span class="pb" style="height:1.9em">Clear</span></div>
        <div class="tiles" id="tiles">
          <div class="tile"><span class="thumb" style="background:#2b3a55">${I.img}</span><small>holiday.jpg</small></div>
          <div class="tile"><span class="thumb" style="background:#3b2f24">${I.doc}</span><small>Invoice-0412.pdf</small></div>
          <div class="tile"><span class="thumb" style="background:#26312c">${I.link}</span><small>Recipe.url</small></div></div>`),
      after: el => setTimeout(() => {
        el.querySelector('#tiles').insertAdjacentHTML('beforeend', `<div class="tile new"><span class="thumb" style="background:#352a44">${I.zip}</span><small>assets.zip</small></div>`);
        el.querySelector('#count').textContent = '4 items';
      }, 1100) },
    { w: 260, h: 34, r: 17, ms: 1100, ...level(I.sun, 80, 55) },
    { w: 260, h: 34, r: 17, ms: 1000, ...status(I.caps, 'Caps Lock on', '') },
    { w: 260, h: 34, r: 17, ms: 1100, ...status(I.bat, 'Charging', '78%') },
    { w: 260, h: 34, r: 17, ms: 1100, ...status(I.bt, 'Buds Pro', '85%') },
    { w: 260, h: 34, r: 17, ms: 1100, ...status(I.wifi, 'Connected', 'Home') },
    { w: 380, h: 64, r: 26, ms: 2000, html: `<div class="row toast"><span class="icon">${I.msg}</span><div class="grow"><div class="tline dim" style="font-size:.85em">Messages</div>
        <div class="tline b">Sam</div><div class="tline dim" style="font-size:.9em">Running five minutes late, save me a seat</div></div></div>` },
  ];

  const notch = document.getElementById('notch');
  const content = document.getElementById('content');
  const screen = document.querySelector('.screen');
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(1.25, screen.clientWidth / 640).toFixed(3));
  addEventListener('resize', fit); fit();

  // ?s=N holds the display on state N, for checking one state's layout.
  const hold = new URLSearchParams(location.search).get('s');
  let i = hold === null ? 0 : +hold % states.length;
  function show() {
    const s = states[i];
    content.classList.remove('on');
    setTimeout(() => {
      notch.style.width = `calc(${s.w}px * var(--s))`;
      notch.style.height = `calc(${s.h}px * var(--s))`;
      notch.style.borderRadius = `0 0 calc(${s.r}px * var(--s)) calc(${s.r}px * var(--s))`;
      content.innerHTML = s.html || '';
      setTimeout(() => { content.classList.add('on'); s.after && s.after(content); }, s.html ? 160 : 0);
    }, 120);
    if (hold !== null) return;
    i = (i + 1) % states.length;
    setTimeout(show, s.ms);
  }
  show();

  fetch('https://api.github.com/repos/mehdiacho/brim/releases/latest')
    .then(r => r.ok ? r.json() : null)
    .then(r => { if (r && r.tag_name) document.getElementById('version').textContent = r.tag_name + ' · Windows 10 and 11 · portable'; })
    .catch(() => {});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brim · a living notch for Windows</title>
<meta name="description" content="Brim puts a living notch at the top of your Windows screen: media and lyrics, volume and brightness, battery, Bluetooth, network and notifications.">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #07080a;
    --panel: #101216;
    --line: #1d2026;
    --text: #eceef2;
    --mist: #9aa0aa;
    --green: #6bdc8c;
    --s: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 16px 20px; }

  /* A screen with Brim's notch cycling through what it can show. Sizes are Brim's own, in DIPs,
     scaled by --s to fit the mock screen. */
  .screen {
    position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 8;
    border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #1b2a4a 0%, #0d1220 45%, #090b10 100%);
  }
  .notch {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: calc(112px * var(--s)); height: calc(14px * var(--s));
    background: #000; border-radius: 0 0 calc(10px * var(--s)) calc(10px * var(--s));
    box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden;
    transition: width .42s cubic-bezier(.3,1.25,.5,1), height .42s cubic-bezier(.3,1.25,.5,1), border-radius .42s;
    font-size: calc(12.5px * var(--s));
  }
  .content {
    position: absolute; inset: 0; display: flex; align-items: center;
    opacity: 0; transition: opacity .16s;
  }
  .content.on { opacity: 1; }
  .content svg { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .row { display: flex; align-items: center; width: 100%; gap: .75em; padding: 0 1.25em; white-space: nowrap; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .b { font-weight: 600; }
  .dim { color: var(--mist); }
  .bar { flex: 1; height: .38em; border-radius: 1em; background: #2a2d33; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 1em; transition: width .5s cubic-bezier(.3,1.2,.5,1); }
  .art { width: 1.4em; height: 1.4em; border-radius: .3em; background: linear-gradient(135deg,#ff8a5c,#c03a7a); flex: none; }
  .eq { display: flex; gap: .16em; align-items: flex-end; height: 1em; }
  .eq i { width: .22em; background: var(--green); border-radius: .2em; animation: eq .7s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: .18s } .eq i:nth-child(3) { animation-delay: .36s }
  @keyframes eq { from { height: .25em } to { height: 1em } }
  .exp { display: flex; padding: 1.4em 1.8em; align-items: flex-start; gap: 1.2em; width: 100%; }
  .exp .art { width: 6.4em; height: 6.4em; border-radius: .9em; }
  .exp .title { font-size: 1.2em; font-weight: 600; }
  .lyric { margin-top: .5em; color: #fff; opacity: .9; transition: opacity .2s; }
  .prog { margin-top: .9em; height: .3em; border-radius: 1em; background: #2a2d33; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 38%; background: #fff; border-radius: 1em; transition: width 2.4s linear; }
  .ctl { display: flex; gap: 1.4em; margin-top: .9em; }
  .ctl svg { fill: #fff; stroke: none; width: 1.3em; height: 1.3em; }
  .clock { font-size: 2.8em; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
  .ring { width: 2.4em; height: 2.4em; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: .8em; }
  .toast { padding: 0 1.1em; gap: .9em; width: 100%; }
  .toast .icon { width: 2.6em; height: 2.6em; border-radius: .7em; background: #1d6bf3; display: grid; place-items: center; flex: none; }
  .toast .icon svg { width: 1.3em; height: 1.3em; }
  .tline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; }
  .btn {
    display: inline-flex; flex-direction: column; align-items: center; padding: 13px 26px; border-radius: 18px;
    font-weight: 650; text-decoration: none; border: 1px solid var(--line); background: var(--panel); line-height: 1.25;
  }
  .btn small { font-weight: 400; font-size: 12px; opacity: .65; margin-top: 2px; }
  .btn.primary { background: var(--text); color: #0a0b0d; border-color: var(--text); }
  .btn:hover { filter: brightness(1.08); }
  footer { color: var(--mist); font-size: 14px; padding: 28px 20px 30px; display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { .notch, .content, .bar i, .prog i { transition: none; } .eq i { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="screen" aria-label="Brim showing music, volume, battery, Bluetooth and notifications">
    <div class="notch" id="notch"><div class="content" id="content"></div></div>
  </div>
  <div class="buttons">
    <a class="btn primary" href="https://github.com/mehdiacho/brim/releases/latest/download/Brim-portable.exe">Download for Windows<small id="version">Windows 10 and 11 · portable</small></a>
    <a class="btn" href="https://github.com/mehdiacho/brim/releases/latest/download/Brim.msix">MSIX package<small>needs Brim.cer trusted</small></a>
  </div>
</main>
<footer>
  <span>Brim by <a href="https://mehdiacho.tech">Mehdi Acho</a></span>
  <span>Lyrics by <a href="https://lrclib.net">LRCLIB</a></span>
</footer>
<script>
  // Line icons, drawn on a 24-unit grid.
  const I = {
    vol: '<svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    caps: '<svg viewBox="0 0 24 24"><path d="M12 4l7 8h-4v4H9v-4H5z"/><path d="M9 20h6"/></svg>',
    kbd: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg>',
    bat: '<svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3"/><path d="M11.5 8.5l-2.5 4h3l-2 3" stroke="#6bdc8c"/></svg>',
    bt: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>',
    wifi: '<svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".6" fill="#fff"/></svg>',
    msg: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    prev: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  };
  const lyrics = ['and the city hums below us', 'headlights paint the overpass', 'we drive until the morning'];
  const level = (icon, from, to) => ({ html: `<div class="row">${icon}<span class="bar"><i style="width:${from}%"></i></span><span class="b">${to}</span></div>`,
    after: el => setTimeout(() => el.querySelector('.bar i').style.width = to + '%', 60) });
  const status = (icon, text, detail) => ({ html: `<div class="row">${icon}<span class="grow b">${text}</span><span class="dim">${detail}</span></div>` });

  // Each state: size in DIPs (Brim's own), corner radius, content, and how long it stays.
  const states = [
    { w: 112, h: 14, r: 10, ms: 1000 },
    { w: 200, h: 26, r: 13, ms: 1500, html: `<div class="row"><span class="art"></span><span class="grow dim">Midnight Drive</span><span class="eq"><i></i><i></i><i></i></span></div>` },
    { w: 520, h: 150, r: 28, ms: 2600, html: `<div class="exp"><span class="art"></span><div class="grow"><div class="title">Midnight Drive</div><div class="dim">Neon Coast</div>
        <div class="lyric" id="lyric">${lyrics[0]}</div><div class="prog"><i></i></div><div class="ctl">${I.prev}${I.pause}${I.next}</div></div></div>`,
      after: el => {
        setTimeout(() => el.querySelector('.prog i').style.width = '52%', 60);
        lyrics.slice(1).forEach((l, i) => setTimeout(() => { const n = el.querySelector('#lyric'); if (n) n.textContent = l; }, 850 * (i + 1)));
      } },
    { w: 260, h: 34, r: 17, ms: 1400, ...level(I.vol, 40, 72) },
    { w: 260, h: 34, r: 17, ms: 1400, ...level(I.sun, 80, 55) },
    { w: 260, h: 34, r: 17, ms: 1200, ...status(I.caps, 'Caps Lock on', '') },
    { w: 260, h: 34, r: 17, ms: 1200, ...status(I.kbd, 'English (United Kingdom)', '') },
    { w: 260, h: 34, r: 17, ms: 1400, ...status(I.bat, 'Charging', '78%') },
    { w: 260, h: 34, r: 17, ms: 1400, ...status(I.bt, 'Buds Pro', '85%') },
    { w: 260, h: 34, r: 17, ms: 1400, ...status(I.wifi, 'Connected', 'Home') },
    { w: 380, h: 64, r: 22, ms: 2200, html: `<div class="row toast"><span class="icon">${I.msg}</span><div class="grow"><div class="tline b">Messages</div>
        <div class="tline">Sam</div><div class="tline dim">Running five minutes late, save me a seat</div></div></div>` },
    { w: 520, h: 150, r: 28, ms: 2200, html: `<div class="exp" style="align-items:center"><div class="grow"><div class="clock" id="clock"></div><div class="dim" id="date"></div></div>
        <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" stroke="#2a2d33" stroke-width="3" fill="none"/>
        <circle cx="18" cy="18" r="15" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="94.2" stroke-dashoffset="20.7" stroke-linecap="round"/></svg><span>78</span></div></div>`,
      after: el => {
        const now = new Date();
        el.querySelector('#clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        el.querySelector('#date').textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
      } },
  ];

  const notch = document.getElementById('notch');
  const content = document.getElementById('content');
  const screen = document.querySelector('.screen');
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(1.25, screen.clientWidth / 640).toFixed(3));
  addEventListener('resize', fit); fit();

  // ?s=N holds the display on state N, for checking one state's layout.
  const hold = new URLSearchParams(location.search).get('s');
  let i = hold === null ? 0 : +hold % states.length;
  function show() {
    const s = states[i];
    content.classList.remove('on');
    setTimeout(() => {
      notch.style.width = `calc(${s.w}px * var(--s))`;
      notch.style.height = `calc(${s.h}px * var(--s))`;
      notch.style.borderRadius = `0 0 calc(${s.r}px * var(--s)) calc(${s.r}px * var(--s))`;
      content.innerHTML = s.html || '';
      setTimeout(() => { content.classList.add('on'); s.after && s.after(content); }, s.html ? 180 : 0);
    }, 140);
    if (hold !== null) return;
    i = (i + 1) % states.length;
    setTimeout(show, s.ms);
  }
  show();

  fetch('https://api.github.com/repos/mehdiacho/brim/releases/latest')
    .then(r => r.ok ? r.json() : null)
    .then(r => { if (r && r.tag_name) document.getElementById('version').textContent = r.tag_name + ' · Windows 10 and 11 · portable'; })
    .catch(() => {});
</script>
</body>
</html>
